[package]
name = "lw-plugin-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust client SDK for the LW Tools WebSocket plugin protocol"
repository = "https://github.com/AnxiangLemon/lw-plugins"

[dependencies]
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

name: Go plugins
on:
  push:
    paths: ['ws/go/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['ws/go/**', '.github/workflows/go.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['ws/go', 'ws/go/bot-hub']
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - run: go test -race ./...
      - run: go vet ./...
      - if: matrix.module == 'ws/go/bot-hub'
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags='-s -w' -o /tmp/bot-hub .
      - if: matrix.module == 'ws/go/bot-hub'
        run: CGO_ENABLED=0 GOOS=windows go build -trimpath -ldflags='-s -w' -o /tmp/bot-hub.exe .
